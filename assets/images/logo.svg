<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#E58A22"/>
      <stop offset="100%" stop-color="#C26A0E"/>
    </linearGradient>
    <linearGradient id="logoGlaze" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F2C8C9"/>
    </linearGradient>
  </defs>

  <!-- Outer Braided Patisserie Donut Ring -->
  <circle cx="24" cy="24" r="18" stroke="url(#logoGold)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2.5 1.5"/>

  <!-- Solid Inner Dough Body -->
  <circle cx="24" cy="24" r="14.5" fill="#3E241A" stroke="#E58A22" stroke-width="1.2"/>

  <!-- Artisan Sugar Glaze Drip Wave -->
  <path d="M12 22C12 16 16.5 11 24 11C31.5 11 36 16 36 22C34.5 24 33 21 31 23C29 25 27.5 22 25.5 24C23.5 26 21.5 22.5 19.5 24C17.5 25.5 15.5 22 14 23.5C12.8 24.5 12 23 12 22Z" fill="url(#logoGlaze)"/>

  <!-- Center Donut Aperture -->
  <circle cx="24" cy="24" r="5.8" fill="#140D09" stroke="#E58A22" stroke-width="1.8"/>

  <!-- Chef Patisserie Golden Crown / Wheat Star Accent at Top -->
  <path d="M24 2.5L25.8 6.5L30 7.2L26.8 10L27.6 14.2L24 12L20.4 14.2L21.2 10L18 7.2L22.2 6.5L24 2.5Z" fill="url(#logoGold)" />
  
  <!-- Hearth Sparkle Dots -->
  <circle cx="16" cy="18" r="1.1" fill="#FFFDF8"/>
  <circle cx="31" cy="17" r="1.1" fill="#FFFDF8"/>
  <circle cx="20" cy="30" r="1" fill="#E58A22"/>
  <circle cx="28" cy="29" r="1" fill="#E58A22"/>
</svg>
